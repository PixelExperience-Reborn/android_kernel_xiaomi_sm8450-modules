name: Qualify coherent mondrian OEM Image, Display, WLAN, MMRM, Camera, Audio, Video, IPA/RMNET and EVA

on:
  # One trusted bringup push qualifies the existing full OEM CI on ServerHive.
  # Never run the heavyweight job for PR/fork events; remove push after passing.
  push:
    branches:
      - bringup/a17-mondrian-oem-bsp-20261111
    paths:
      - .github/workflows/oem-coherent-wlan-compile.yml
      - patches/xiaomi-display/**
      - tools/qualify_xiaomi_garnet_display.py
  workflow_dispatch:
    inputs:
      scope:
        description: 'Diagnostic build scope (never production)'
        required: true
        type: choice
        default: display
        options:
          - display
          - full-bsp
          - release

concurrency:
  group: mondrian-coherent-external-wlan-build-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[serverhive-qualification]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify Xiaomi WLAN source and existing ABI contracts
        run: |
          set -euo pipefail
          python3 tools/mondrian_source_pins.py check
          python3 -m unittest discover -s tests -v
          python3 tools/verify_xiaomi_camera_submodule.py
          python3 tools/verify_mondrian_audio_video_sources.py
          bash -n tools/build_mondrian_audio_video.sh
          sh -n tools/collect_mondrian_camera_runtime.sh
          python3 -m py_compile tools/check_mondrian_camera_runtime.py
          python3 tools/verify_oem_wlan.py
          python3 tools/apply_oem_wlan_fix.py
          python3 tools/verify_qcom_mmrm.py
          python3 tools/verify_qualcomm_data_eva_sources.py
          bash -n tools/build_mondrian_data_eva.sh
          bash -n tools/install_ci_prerequisites.sh
          bash -n tools/prepare_mondrian_lto_resources.sh
          bash -n tools/prepare_mondrian_lto_linker.sh
          bash tools/install_ci_prerequisites.sh --print-sources > /tmp/mondrian-apt-sources.list
          grep -Fq 'https://archive.ubuntu.com/ubuntu' /tmp/mondrian-apt-sources.list
          grep -Fq 'https://security.ubuntu.com/ubuntu' /tmp/mondrian-apt-sources.list
          if grep -Fq 'azure.archive.ubuntu.com' /tmp/mondrian-apt-sources.list; then
            echo '::error::Azure apt mirror must not be used'
            exit 1
          fi

      - name: Check original Xiaomi candidate patch series before reserving ServerHive
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        uses: actions/checkout@v4
        with:
          repository: MiCode/vendor_opensource_display-drivers
          ref: bf0d5e23be5457001a18aa9dcd68cb17994ae36a
          path: xiaomi-display-preflight
          persist-credentials: false
      - name: Validate patch contexts and Python syntax
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        run: |
          set -euo pipefail
          python3 -m py_compile tools/qualify_xiaomi_garnet_display.py
          for patch in patches/xiaomi-display/*.patch; do
            git -C xiaomi-display-preflight apply --check "$GITHUB_WORKSPACE/$patch"
            git -C xiaomi-display-preflight apply "$GITHUB_WORKSPACE/$patch"
          done
          git -C xiaomi-display-preflight diff --check
  external-wlan:
    # Full OEM kernel and external BSP compilation is explicitly opt-in.
    # The automatic module-contract workflow owns ordinary source checks.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/bringup/a17-mondrian-oem-bsp-20261111' && contains(github.event.head_commit.message, '[serverhive-qualification]'))
    needs: source
    runs-on:
      group: mondrian-heavy
      labels: pe-mondrian-heavy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Resolve and validate canonical source pins
        id: pins
        run: python3 tools/mondrian_source_pins.py github
      - uses: actions/checkout@v4
        with:
          repository: PixelExperience-Reborn/android_kernel_xiaomi_sm8450
          ref: ${{ steps.pins.outputs.kernel }}
          path: kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PixelExperience-Reborn/android_kernel_xiaomi_sm8450-devicetrees
          ref: ${{ steps.pins.outputs.devicetrees }}
          path: device-tree
          submodules: recursive
          persist-credentials: false
      - name: Verify installed Ubuntu dependencies on isolated ServerHive
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = serverhive-mondrian
          for pkg in bc bison flex make gcc device-tree-compiler libssl-dev libelf-dev dwarves binutils-aarch64-linux-gnu kmod; do
            dpkg-query -W '-f=${Status}' "$pkg" | grep -Fxq 'install ok installed' || { echo "::error::Missing preinstalled package $pkg"; exit 1; }
          done
          df -h "$RUNNER_TEMP"
          free -h
      - name: Install signed Ubuntu 24.04 kernel build dependencies (no Azure mirror)
        if: runner.environment == 'github-hosted'
        timeout-minutes: 13
        run: bash tools/install_ci_prerequisites.sh
      - name: Restore compiler cache
        if: runner.environment == 'github-hosted'
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/google-clang
          key: mondrian-a17-clang-r614150-c9ed23e2ba198658b630d4b10e09fa980cd43119
      - name: Fetch exact Google Android LLVM23 compiler
        if: runner.environment == 'github-hosted' && steps.clang-cache.outputs.cache-hit != 'true'
        run: bash kernel/tools/fetch_android_kernel_clang.sh /tmp/google-clang
      - uses: actions/cache/save@v4
        if: runner.environment == 'github-hosted' && steps.clang-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/google-clang
          key: mondrian-a17-clang-r614150-c9ed23e2ba198658b630d4b10e09fa980cd43119
      - name: Restore pinned Google LLVM23 into isolated ServerHive workspace
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          : "${RUNNER_TOOL_CACHE:?Self-hosted runner tool-cache path missing}"
          toolchain="$RUNNER_TOOL_CACHE/pe-google-clang-r614150"
          mkdir -p "$RUNNER_TOOL_CACHE"
          if [[ ! -e "$toolchain" ]]; then
            bash kernel/tools/fetch_android_kernel_clang.sh "$toolchain"
          fi
          test "$(git -C "$toolchain" rev-parse HEAD)" = c9ed23e2ba198658b630d4b10e09fa980cd43119
          test -x "$toolchain/clang-r614150/bin/clang"
          test -x "$toolchain/clang-r614150/bin/ld.lld"
          # The sandbox hides host /tmp: do not trust restored GitHub-hosted
          # cache paths. Keep all existing OEM build commands unchanged.
          if [[ -L /tmp/google-clang ]]; then
            test "$(readlink /tmp/google-clang)" = "$toolchain"
          elif [[ -e /tmp/google-clang ]]; then
            echo "::error::Unexpected existing /tmp/google-clang inside sandbox"
            exit 1
          else
            ln -s "$toolchain" /tmp/google-clang
          fi
          test "$(git -C /tmp/google-clang rev-parse HEAD)" = c9ed23e2ba198658b630d4b10e09fa980cd43119
          /tmp/google-clang/clang-r614150/bin/clang --version
          echo "[PASS] Exact Google LLVM23 available inside ServerHive sandbox"
      - name: Generate the SAME OEM mondrian configuration as main kernel CI
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          test "$(git -C /tmp/google-clang rev-parse HEAD)" = c9ed23e2ba198658b630d4b10e09fa980cd43119
          test "$(git -C kernel rev-parse HEAD)" = "$PE_KERNEL_SHA"
          grep -Fx "SUBLEVEL = 81" kernel/Makefile
          (cd kernel && python3 tools/verify_mondrian_thermal.py)
          (cd kernel && python3 tools/verify_mondrian_goodix.py)
          (cd kernel && python3 tools/verify_mondrian_display_clock.py)
          mkdir -p "$RUNNER_TEMP/mondrian-out"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" gki_defconfig
          bash kernel/scripts/kconfig/merge_config.sh -m -r \
            -O "$RUNNER_TEMP/mondrian-out" \
            "$RUNNER_TEMP/mondrian-out/.config" \
            kernel/arch/arm64/configs/vendor/mondrian_GKI.config \
            tools/config/mondrian_gki_hardening.config
          make -C kernel O="$RUNNER_TEMP/mondrian-out" olddefconfig
          python3 tools/verify_mondrian_kernel_hardening.py \
            --generated-config "$RUNNER_TEMP/mondrian-out/.config" \
            --out "$RUNNER_TEMP/mondrian-gki-hardening-evidence.json"
          python3 kernel/tools/verify_mondrian_oem_eroFS.py \
            --generated-config "$RUNNER_TEMP/mondrian-out/.config"
      - name: Prepare bounded Full LTO memory and disk headroom
        if: runner.environment == 'github-hosted'
        run: bash tools/prepare_mondrian_lto_resources.sh
      - name: Build full OEM vmlinux and in-tree modules first
        env:
          PE_CI_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          echo "::group::Full LTO runner memory and disk headroom"
          free -h
          df -h "$RUNNER_TEMP"
          swapon --show
          echo "::endgroup::"
          # Use the same exact Google LLVM23 linker, but bound LLD's own threads.
          # This does NOT select ThinLTO, remove CFI/SCS/HW-tag KASAN, or touch OEM code.
          if [[ "$PE_CI_ENVIRONMENT" == "github-hosted" ]]; then
            source tools/prepare_mondrian_lto_linker.sh
          else
            # Same unwrapped LLVM23 LLD used by the successful ServerHive build.
            test "$PE_CI_ENVIRONMENT" = "self-hosted"
          fi
          # Retain all HW KASAN, Full LTO, CFI and SCS build settings.
          # -j2 bounds concurrent compilations; LTO link remains real.
          monitor_resources() {
            while :; do
              echo "::group::mondrian kernel RSS and headroom $(date -u +%FT%TZ)"
              free -m
              df -h "$RUNNER_TEMP"
              swapon --show || true
              ps -eo pid,comm,rss,%mem,%cpu --sort=-rss | head -n 12 || true
              cat /sys/fs/cgroup/memory.events 2>/dev/null || true
              cat /proc/pressure/memory 2>/dev/null || true
              echo "::endgroup::"
              sleep 90
            done
          }
          monitor_resources &
          monitor_pid=$!
          report_link_outcome() {
            local status=$?
            kill "$monitor_pid" 2>/dev/null || true
            if (( status != 0 )); then
              echo "::error::OEM Full LTO exited with status $status; runner cancellation, OOM and linker failure require separate evidence"
              free -m || true
              df -h "$RUNNER_TEMP" || true
              cat /sys/fs/cgroup/memory.events 2>/dev/null || true
              cat /proc/pressure/memory 2>/dev/null || true
            fi
          }
          trap report_link_outcome EXIT
          if [[ "$PE_CI_ENVIRONMENT" == "self-hosted" ]]; then
            make -C kernel O="$RUNNER_TEMP/mondrian-out" -j8 vmlinux Image modules
          else
            make -C kernel O="$RUNNER_TEMP/mondrian-out" -j2 vmlinux Image modules
          fi
          test -s "$RUNNER_TEMP/mondrian-out/Module.symvers"
      - name: Verify OEM mondrian Camera power LDO driver and compiled module
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/mondrian-out/.config"
          ldo="$RUNNER_TEMP/mondrian-out/drivers/misc/wl2866d.ko"
          grep -Fxq 'CONFIG_LDO_WL2866D=m' "$cfg"
          grep -Fq 'compatible = "xiaomi,wl2866d";' \
            device-tree/qcom/mondrian-wl2866d.dtsi
          grep -Fq 'compatible = "xiaomi,wl2866d"' \
            kernel/drivers/misc/wl2866d.c
          grep -Fq 'subsys_initcall(wl2866d_i2c_init);' \
            kernel/drivers/misc/wl2866d.c
          test -s "$ldo"
          test "$(modinfo -F name "$ldo")" = wl2866d
          echo "[PASS] OEM mondrian WL2866D module and matching I2C binding compiled" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] Camera regulator power sequencing and physical hardware" >> "$GITHUB_STEP_SUMMARY"
      - name: Audit all original OEM and critical mondrian kernel modules
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-
          python3 tools/audit_mondrian_kernel_module_inventory.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --expected-kernel-commit "$PE_KERNEL_SHA" \
            --out "$RUNNER_TEMP/mondrian-inventory.json"
      - name: Apply reviewed Xiaomi WLAN header correction
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        run: |
          set -euo pipefail
          python3 tools/apply_oem_wlan_fix.py
          python3 tools/apply_oem_wlan_fix.py --apply
          grep -F 'uint8_t mdie[SIR_MDIE_SIZE]);' upstream/xiaomi-wlan/qcacld-3.0/core/mac/src/include/parser_api.h
      - name: Build Qualcomm official MMRM against selected OEM Module.symvers
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          mmrm="$GITHUB_WORKSPACE/upstream/qualcomm/mmrm"
          # Qualcomm's top-level MMRM Kbuild also descends into test/,
          # which has no Makefile in this pinned upstream tag. Compile only
          # the production driver/Kbuild, preserving the original sources.
          test -f "$mmrm/driver/Kbuild"
          test -f "$mmrm/config/waipiommrmconf.h"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$mmrm/driver" MMRM_ROOT="$mmrm" CONFIG_MSM_MMRM=y \
            KCFLAGS="-include $mmrm/config/waipiommrmconf.h" modules
          module="$mmrm/driver/msm-mmrm.ko"
          test -s "$module"
          modinfo -F vermagic "$module"
          python3 tools/verify_external_module_abi.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --module "$module" --expected-kernel-commit "$PE_KERNEL_SHA" \
            --out "$RUNNER_TEMP/mmrm-abi-evidence.json"
          echo "[PASS] Qualcomm official MMRM compiled against OEM kernel symbols" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] Qualcomm display/camera/audio users and hardware validation" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Xiaomi QCACLD QCA6490 as external kernel module
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          vendor_root="$GITHUB_WORKSPACE/upstream/xiaomi-wlan"
          wlan_root="$vendor_root/qcacld-3.0"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$wlan_root" WLAN_ROOT="$wlan_root" \
            WLAN_COMMON_INC="$vendor_root/qca-wifi-host-cmn" \
            WLAN_FW_API="$vendor_root/fw-api" \
            WLAN_PROFILE=qca6490 DEVNAME=qca6490 MODNAME=qca_cld3_qca6490 \
            CONFIG_CNSS_QCA6490=y CONFIG_ROME_IF=pci \
            WLAN_CTRL_NAME=wlan TARGET_BUILD_VARIANT=user DYNAMIC_SINGLE_CHIP=qca6490 \
            CONFIG_QCA_CLD_WLAN=m CONFIG_QCA_WIFI_ISOC=0 CONFIG_QCA_WIFI_2_0=1 \
            modules
          # These are the *actual* OEM Kbuild-selected objects, not a
          # misleading .ko basename or a success-only Module.symvers check.
          test -s "$wlan_root/cmn/hif/src/dispatcher/multibus_pci.o"
          test -s "$wlan_root/cmn/hal/wifi3.0/qca6490/hal_6490.o"
          if test -e "$wlan_root/cmn/hif/src/dispatcher/multibus_snoc.o"; then
            echo "::error::SNOC HIF object selected for PCIe mondrian QCA6490"
            exit 1
          fi
          module="$wlan_root/qca_cld3_qca6490.ko"
          test -s "$module"
          modinfo -F vermagic "$module"
          modinfo -F depends "$module"
          python3 tools/verify_external_module_abi.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --module "$module" --expected-kernel-commit "$PE_KERNEL_SHA" \
            --out "$RUNNER_TEMP/wlan-abi-evidence.json"
          echo "[PASS] Xiaomi QCACLD compiled against own kernel Module.symvers" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] WLAN firmware, vendor_dlkm integration, hardware boot" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Qualcomm Display against the SAME compiled OEM Image and MMRM symbols
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          display="$GITHUB_WORKSPACE/kernel/techpack/display"
          mmrm_sym="$GITHUB_WORKSPACE/upstream/qualcomm/mmrm/driver/Module.symvers"
          test -f "$display/msm/Kbuild"
          test -s "$mmrm_sym"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$display/msm" DISPLAY_ROOT="$display" \
            KERNEL_SRC="$GITHUB_WORKSPACE/kernel" KERNEL_ROOT="$GITHUB_WORKSPACE/kernel" \
            OUT="$RUNNER_TEMP/mondrian-out" KBUILD_EXTRA_SYMBOLS="$mmrm_sym" modules
          test -s "$display/msm/msm_drm.ko"
          modinfo -F name "$display/msm/msm_drm.ko" | grep -Fx msm_drm
          python3 tools/verify_external_module_abi.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --module "$display/msm/msm_drm.ko" \
            --expected-kernel-commit "$PE_KERNEL_SHA" \
            --out "$RUNNER_TEMP/display-abi-evidence.json"
          echo "[PASS] msm_drm.ko compiled with the same Module.symvers as WLAN/MMRM" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout exact Xiaomi garnet Display candidate
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        uses: actions/checkout@v4
        with:
          repository: MiCode/vendor_opensource_display-drivers
          ref: bf0d5e23be5457001a18aa9dcd68cb17994ae36a
          path: xiaomi-display
          persist-credentials: false
      - name: Checkout exact manufacturer mondrian display DT
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        uses: actions/checkout@v4
        with:
          repository: MiCode/vendor_qcom_proprietary_display-devicetree
          ref: ab5bc7b921d3d4072ce11eecfde984382e3ec695
          path: xiaomi-display-dt
          persist-credentials: false
      - name: Compile full Xiaomi Display with real OEM and MMRM symbols
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/mmrm-abi-evidence.json"
          test -s "$RUNNER_TEMP/display-abi-evidence.json"
          test "$(git -C upstream/qualcomm/mmrm rev-parse HEAD)" = "$(git ls-tree HEAD upstream/qualcomm/mmrm | awk '{print $3}')"
          python3 tools/qualify_xiaomi_garnet_display.py \
            --kernel kernel --xiaomi-display xiaomi-display \
            --xiaomi-display-dt xiaomi-display-dt --clang-root /tmp/google-clang \
            --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --baseline-evidence "$RUNNER_TEMP/display-abi-evidence.json" \
            --mmrm-symvers "$GITHUB_WORKSPACE/upstream/qualcomm/mmrm/driver/Module.symvers" \
            --out "$RUNNER_TEMP/garnet-full" --build
          test -s "$RUNNER_TEMP/garnet-full/candidate-msm_drm.ko"
          modinfo -F name "$RUNNER_TEMP/garnet-full/candidate-msm_drm.ko" | grep -Fx msm_drm
          echo '[PASS] Xiaomi candidate msm_drm.ko built with actual OEM vmlinux, Module.symvers and MMRM; userspace ABI and hardware pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Compile original Xiaomi camera/cameralog with PM8350C and SAME OEM MMRM symbols
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.scope == 'display') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[xiaomi-display-only]'))) }}
        run: |
          set -euo pipefail
          python3 tools/verify_xiaomi_camera_submodule.py
          test "$(git -C xiaomi-camera-source rev-parse HEAD)" = 9ed4ce96d49c0759c6365627113c5f59c2407942
          python3 -m unittest discover -s tests -p 'test_xiaomi_camera_clang23_fix.py' -v
          python3 tools/apply_xiaomi_camera_clang23_fix.py --source xiaomi-camera-source
          python3 tools/apply_xiaomi_camera_clang23_fix.py \
            --source xiaomi-camera-source --apply \
            --evidence "$RUNNER_TEMP/camera-clang23-fix-evidence.json"
          python3 -m unittest discover -s tests -p 'test_mondrian_pmic_flash.py' -v
          python3 tools/select_mondrian_pmic_flash.py \
            --source xiaomi-camera-source \
            --device-tree device-tree \
            --manifest mondrian-camera-flash-policy.json \
            --apply --evidence "$RUNNER_TEMP/camera-pmic-selection-evidence.json"
          test "$(git -C xiaomi-camera-source hash-object drivers/cam_sensor_module/cam_csiphy/cam_csiphy_soc.c)" = 5bfa19646ef62079a312db8eb2ecddd3ca9b701b
          python3 -m unittest discover -s tests -p 'test_mondrian_camera_ois_rollback.py' -v
          git -C xiaomi-camera-source apply --check "$GITHUB_WORKSPACE/patches/mondrian-m11a-csiphy.patch"
          git -C xiaomi-camera-source apply "$GITHUB_WORKSPACE/patches/mondrian-m11a-csiphy.patch"
          git -C xiaomi-camera-source apply "$GITHUB_WORKSPACE/patches/mondrian-wl2866d-power-rollback.patch"
          git -C xiaomi-camera-source apply "$GITHUB_WORKSPACE/patches/mondrian-camera-shared-pinctrl-gpios.patch"
          git -C xiaomi-camera-source apply "$GITHUB_WORKSPACE/patches/mondrian-camera-ois-driver-init-rollback.patch"
          grep -Fq '"qcom,csiphy-v2.1.3-xiaomi-m11a"' xiaomi-camera-source/drivers/cam_sensor_module/cam_csiphy/cam_csiphy_soc.c
          git -C xiaomi-camera-source diff --check
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
