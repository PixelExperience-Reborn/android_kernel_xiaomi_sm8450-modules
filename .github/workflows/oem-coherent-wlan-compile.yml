name: Qualify coherent mondrian OEM Image, Display, WLAN, MMRM, Camera, Audio and Video

on:
  push:
    branches: [bringup/a17-mondrian-oem-bsp-20261111]
  # Full OEM build must also run on the active bringup PR; otherwise
  # GitHub's PR-only checks validate sources but skip the kernel/module job.
  pull_request:
    paths:
      - .github/workflows/oem-coherent-wlan-compile.yml
      - .gitmodules
      - upstream/xiaomi-audio
      - upstream/qualcomm/video
      - tools/build_mondrian_audio_video.sh
      - tools/apply_xiaomi_audio_clang23_fix.py
      - tools/apply_qualcomm_vidc_clang23_fix.py
      - tests/test_qualcomm_vidc_clang23_fix.py
      - tests/test_xiaomi_audio_clang23_fix.py
      - tools/verify_mondrian_audio_video_sources.py
      - tests/test_mondrian_audio_video_sources.py
      - tools/audit_mondrian_kernel_module_inventory.py
      - tests/test_kernel_module_inventory.py
      - tools/stage_mondrian_wlan_kmi.py
      - tests/test_oem_kmi_staging.py
      - xiaomi-camera-source
      - tools/verify_mondrian_camera_elf.py
      - tools/verify_mondrian_camera_wl2866d_abi.py
      - tests/test_mondrian_camera_wl2866d_abi.py
      - tools/select_mondrian_pmic_flash.py
      - mondrian-camera-flash-policy.json
      - patches/mondrian-m11a-csiphy.patch
      - patches/mondrian-wl2866d-power-rollback.patch
      - patches/mondrian-camera-shared-pinctrl-gpios.patch
  workflow_dispatch:

concurrency:
  group: mondrian-coherent-external-wlan-build-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify Xiaomi WLAN source and existing ABI contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 tools/verify_xiaomi_camera_submodule.py
          python3 tools/verify_mondrian_audio_video_sources.py
          bash -n tools/build_mondrian_audio_video.sh
          python3 tools/verify_oem_wlan.py
          python3 tools/apply_oem_wlan_fix.py
          python3 tools/verify_qcom_mmrm.py
          bash -n tools/install_ci_prerequisites.sh
          bash tools/install_ci_prerequisites.sh --print-sources > /tmp/mondrian-apt-sources.list
          grep -Fq 'https://archive.ubuntu.com/ubuntu' /tmp/mondrian-apt-sources.list
          grep -Fq 'https://security.ubuntu.com/ubuntu' /tmp/mondrian-apt-sources.list
          if grep -Fq 'azure.archive.ubuntu.com' /tmp/mondrian-apt-sources.list; then
            echo '::error::Azure apt mirror must not be used'
            exit 1
          fi

  external-wlan:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PixelExperience-Reborn/android_kernel_xiaomi_sm8450
          ref: c67ed74ffe11bd2133b560078a20cf0c04e18d97
          path: kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PixelExperience-Reborn/android_kernel_xiaomi_sm8450-devicetrees
          ref: a0db12120fc6c29cc5855d3e1699c9ef73594ee3
          path: device-tree
          submodules: recursive
          persist-credentials: false
      - name: Install signed Ubuntu 24.04 kernel build dependencies (no Azure mirror)
        timeout-minutes: 13
        run: bash tools/install_ci_prerequisites.sh
      - name: Restore compiler cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/google-clang
          key: mondrian-a17-clang-r614150-c9ed23e2ba198658b630d4b10e09fa980cd43119
      - name: Fetch exact Google Android LLVM23 compiler
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: bash kernel/tools/fetch_android_kernel_clang.sh /tmp/google-clang
      - uses: actions/cache/save@v4
        if: steps.clang-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/google-clang
          key: mondrian-a17-clang-r614150-c9ed23e2ba198658b630d4b10e09fa980cd43119
      - name: Generate the SAME OEM mondrian configuration as main kernel CI
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          test "$(git -C /tmp/google-clang rev-parse HEAD)" = c9ed23e2ba198658b630d4b10e09fa980cd43119
          test "$(git -C kernel rev-parse HEAD)" = c67ed74ffe11bd2133b560078a20cf0c04e18d97
          grep -Fx "SUBLEVEL = 81" kernel/Makefile
          (cd kernel && python3 tools/verify_mondrian_thermal.py)
          (cd kernel && python3 tools/verify_mondrian_goodix.py)
          (cd kernel && python3 tools/verify_mondrian_display_clock.py)
          mkdir -p "$RUNNER_TEMP/mondrian-out"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" gki_defconfig
          bash kernel/scripts/kconfig/merge_config.sh -m -r \
            -O "$RUNNER_TEMP/mondrian-out" \
            "$RUNNER_TEMP/mondrian-out/.config" \
            kernel/arch/arm64/configs/vendor/mondrian_GKI.config
          make -C kernel O="$RUNNER_TEMP/mondrian-out" olddefconfig
          python3 kernel/tools/verify_mondrian_oem_eroFS.py \
            --generated-config "$RUNNER_TEMP/mondrian-out/.config"
      - name: Build full OEM vmlinux and in-tree modules first
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 vmlinux Image modules
          test -s "$RUNNER_TEMP/mondrian-out/Module.symvers"
      - name: Verify OEM mondrian Camera power LDO driver and compiled module
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/mondrian-out/.config"
          ldo="$RUNNER_TEMP/mondrian-out/drivers/misc/wl2866d.ko"
          grep -Fxq 'CONFIG_LDO_WL2866D=m' "$cfg"
          grep -Fq 'compatible = "xiaomi,wl2866d";' \
            device-tree/qcom/mondrian-wl2866d.dtsi
          grep -Fq 'compatible = "xiaomi,wl2866d"' \
            kernel/drivers/misc/wl2866d.c
          grep -Fq 'subsys_initcall(wl2866d_i2c_init);' \
            kernel/drivers/misc/wl2866d.c
          test -s "$ldo"
          test "$(modinfo -F name "$ldo")" = wl2866d
          echo "[PASS] OEM mondrian WL2866D module and matching I2C binding compiled" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] Camera regulator power sequencing and physical hardware" >> "$GITHUB_STEP_SUMMARY"
      - name: Audit all original OEM and critical mondrian kernel modules
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-
          python3 tools/audit_mondrian_kernel_module_inventory.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --expected-kernel-commit c67ed74ffe11bd2133b560078a20cf0c04e18d97 \
            --out "$RUNNER_TEMP/mondrian-inventory.json"
      - name: Apply reviewed Xiaomi WLAN header correction
        run: |
          set -euo pipefail
          python3 tools/apply_oem_wlan_fix.py
          python3 tools/apply_oem_wlan_fix.py --apply
          grep -F 'uint8_t mdie[SIR_MDIE_SIZE]);' upstream/xiaomi-wlan/qcacld-3.0/core/mac/src/include/parser_api.h
      - name: Build Qualcomm official MMRM against selected OEM Module.symvers
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          mmrm="$GITHUB_WORKSPACE/upstream/qualcomm/mmrm"
          # Qualcomm's top-level MMRM Kbuild also descends into test/,
          # which has no Makefile in this pinned upstream tag. Compile only
          # the production driver/Kbuild, preserving the original sources.
          test -f "$mmrm/driver/Kbuild"
          test -f "$mmrm/config/waipiommrmconf.h"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$mmrm/driver" MMRM_ROOT="$mmrm" CONFIG_MSM_MMRM=y \
            KCFLAGS="-include $mmrm/config/waipiommrmconf.h" modules
          module="$mmrm/driver/msm-mmrm.ko"
          test -s "$module"
          modinfo -F vermagic "$module"
          python3 tools/verify_external_module_abi.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --module "$module" --expected-kernel-commit c67ed74ffe11bd2133b560078a20cf0c04e18d97 \
            --out "$RUNNER_TEMP/mmrm-abi-evidence.json"
          echo "[PASS] Qualcomm official MMRM compiled against OEM kernel symbols" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] Qualcomm display/camera/audio users and hardware validation" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Xiaomi QCACLD QCA6490 as external kernel module
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          vendor_root="$GITHUB_WORKSPACE/upstream/xiaomi-wlan"
          wlan_root="$vendor_root/qcacld-3.0"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$wlan_root" WLAN_ROOT="$wlan_root" \
            WLAN_COMMON_INC="$vendor_root/qca-wifi-host-cmn" \
            WLAN_FW_API="$vendor_root/fw-api" \
            WLAN_PROFILE=qca6490 DEVNAME=qca6490 MODNAME=qca_cld3_qca6490 \
            CONFIG_QCA_CLD_WLAN=m CONFIG_QCA_WIFI_ISOC=0 CONFIG_QCA_WIFI_2_0=1 \
            modules
          module="$wlan_root/qca_cld3_qca6490.ko"
          test -s "$module"
          modinfo -F vermagic "$module"
          modinfo -F depends "$module"
          python3 tools/verify_external_module_abi.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --module "$module" --expected-kernel-commit c67ed74ffe11bd2133b560078a20cf0c04e18d97 \
            --out "$RUNNER_TEMP/wlan-abi-evidence.json"
          echo "[PASS] Xiaomi QCACLD compiled against own kernel Module.symvers" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] WLAN firmware, vendor_dlkm integration, hardware boot" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Qualcomm Display against the SAME compiled OEM Image and MMRM symbols
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          display="$GITHUB_WORKSPACE/kernel/techpack/display"
          mmrm_sym="$GITHUB_WORKSPACE/upstream/qualcomm/mmrm/driver/Module.symvers"
          test -f "$display/msm/Kbuild"
          test -s "$mmrm_sym"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$display/msm" DISPLAY_ROOT="$display" \
            KERNEL_SRC="$GITHUB_WORKSPACE/kernel" KERNEL_ROOT="$GITHUB_WORKSPACE/kernel" \
            OUT="$RUNNER_TEMP/mondrian-out" KBUILD_EXTRA_SYMBOLS="$mmrm_sym" modules
          test -s "$display/msm/msm_drm.ko"
          modinfo -F name "$display/msm/msm_drm.ko" | grep -Fx msm_drm
          python3 tools/verify_external_module_abi.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --module "$display/msm/msm_drm.ko" \
            --expected-kernel-commit c67ed74ffe11bd2133b560078a20cf0c04e18d97 \
            --out "$RUNNER_TEMP/display-abi-evidence.json"
          echo "[PASS] msm_drm.ko compiled with the same Module.symvers as WLAN/MMRM" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile original Xiaomi camera/cameralog with PM8350C and SAME OEM MMRM symbols
        run: |
          set -euo pipefail
          python3 tools/verify_xiaomi_camera_submodule.py
          test "$(git -C xiaomi-camera-source rev-parse HEAD)" = 9ed4ce96d49c0759c6365627113c5f59c2407942
          python3 -m unittest discover -s tests -p 'test_xiaomi_camera_clang23_fix.py' -v
          python3 tools/apply_xiaomi_camera_clang23_fix.py --source xiaomi-camera-source
          python3 tools/apply_xiaomi_camera_clang23_fix.py \
            --source xiaomi-camera-source --apply \
            --evidence "$RUNNER_TEMP/camera-clang23-fix-evidence.json"
          python3 -m unittest discover -s tests -p 'test_mondrian_pmic_flash.py' -v
          python3 tools/select_mondrian_pmic_flash.py \
            --source xiaomi-camera-source \
            --device-tree device-tree \
            --manifest mondrian-camera-flash-policy.json \
            --apply --evidence "$RUNNER_TEMP/camera-pmic-selection-evidence.json"
          test "$(git -C xiaomi-camera-source hash-object drivers/cam_sensor_module/cam_csiphy/cam_csiphy_soc.c)" = 5bfa19646ef62079a312db8eb2ecddd3ca9b701b
          git -C xiaomi-camera-source apply --check "$GITHUB_WORKSPACE/patches/mondrian-m11a-csiphy.patch"
          git -C xiaomi-camera-source apply "$GITHUB_WORKSPACE/patches/mondrian-m11a-csiphy.patch"
          git -C xiaomi-camera-source apply "$GITHUB_WORKSPACE/patches/mondrian-wl2866d-power-rollback.patch"
          git -C xiaomi-camera-source apply "$GITHUB_WORKSPACE/patches/mondrian-camera-shared-pinctrl-gpios.patch"
          grep -Fq '"qcom,csiphy-v2.1.3-xiaomi-m11a"' xiaomi-camera-source/drivers/cam_sensor_module/cam_csiphy/cam_csiphy_soc.c
          git -C xiaomi-camera-source diff --check
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          cam="$GITHUB_WORKSPACE/xiaomi-camera-source"
          mmrm_symbols="$GITHUB_WORKSPACE/upstream/qualcomm/mmrm/driver/Module.symvers"
          test -s "$mmrm_symbols"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$cam" CAMERA_KERNEL_ROOT="$cam" KERNEL_ROOT="$GITHUB_WORKSPACE/kernel" \
            KBUILD_EXTRA_SYMBOLS="$mmrm_symbols" modules \
            2>&1 | tee "$RUNNER_TEMP/camera-oem-build.log"
          strings "$cam/camera.ko" | grep -Fx 'qcom,csiphy-v2.1.3-xiaomi-m11a'
          strings "$cam/camera.ko" | grep -Fx 'qcom,shared-pinctrl-gpios'
          for item in camera cameralog; do
            test -s "$cam/$item.ko"
            python3 tools/verify_external_module_abi.py \
              --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
              --module "$cam/$item.ko" \
              --expected-kernel-commit c67ed74ffe11bd2133b560078a20cf0c04e18d97 \
              --out "$RUNNER_TEMP/$item-oem-abi-evidence.json"
          done
          python3 -m unittest discover -s tests -p 'test_mondrian_camera_elf.py' -v
          python3 tools/verify_mondrian_camera_elf.py \
            --module "$cam/camera.ko" \
            --kernel kernel \
            --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --expected-kernel-commit c67ed74ffe11bd2133b560078a20cf0c04e18d97 \
            --out "$RUNNER_TEMP/camera-pmic-elf-evidence.json"
          echo "[PASS] Xiaomi Camera modules compiled with OEM Image, MMRM and Qualcomm PMIC" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] mondrian hardware sensors/LED channel/Android Camera HAL" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Xiaomi Qualcomm Audio, AW882xx and Qualcomm VIDC against exact OEM kernel
        run: bash tools/build_mondrian_audio_video.sh
      - name: Verify WLAN/MMRM/Display/Camera/Audio/Video and critical OEM module dependency closures
        run: |
          set -euo pipefail
          # Import the same 15-module source contract as the compiled inventory
          # check; these are diagnostic roots, never an Android load list.
          mapfile -t critical_roots < <(python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from audit_mondrian_kernel_module_inventory import MONDRIAN_CRITICAL_MODULES
          for entry in sorted(MONDRIAN_CRITICAL_MODULES):
              print(entry)
          PY
          )
          test "${#critical_roots[@]}" -eq 15
          args=()
          for ko in "${critical_roots[@]}"; do
            args+=(--audit-oem-root "$ko")
          done
          # All built audio outputs are diagnostic roots, never a product load list.
          mapfile -t media_roots < "$RUNNER_TEMP/mondrian-media-roots.txt"
          test "${#media_roots[@]}" -gt 2
          for ko in "${media_roots[@]}"; do
            args+=(--external-root "$ko")
          done
          python3 tools/stage_mondrian_wlan_kmi.py \
            --kernel kernel \
            --expected-kernel-commit c67ed74ffe11bd2133b560078a20cf0c04e18d97 \
            --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --wlan "$GITHUB_WORKSPACE/upstream/xiaomi-wlan/qcacld-3.0/qca_cld3_qca6490.ko" \
            --mmrm "$GITHUB_WORKSPACE/upstream/qualcomm/mmrm/driver/msm-mmrm.ko" \
            --display "$GITHUB_WORKSPACE/kernel/techpack/display/msm/msm_drm.ko" \
            --camera "$GITHUB_WORKSPACE/xiaomi-camera-source/camera.ko" \
            --cameralog "$GITHUB_WORKSPACE/xiaomi-camera-source/cameralog.ko" \
            "${args[@]}" \
            --out "$RUNNER_TEMP/mondrian-stage"
          # Camera power's OEM WL2866D is NOT in Xiaomi modules.list;
          # enforce that our independent diagnostic root is really staged.
          python3 - "$RUNNER_TEMP/mondrian-stage/mondrian-wlan-diagnostic-manifest.json" <<'PY'
          import json
          import pathlib
          import sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          name = "wl2866d"
          assert name in manifest["audited_oem_roots"], "WL2866D not an audited root"
          assert manifest["module_files"].get(name) == "kernel/drivers/misc/wl2866d.ko", "WL2866D not staged from OEM source"
          assert name in manifest["staged_module_order"], "WL2866D absent from dependency closure"
          load = manifest["modprobe_oem_diagnostic_roots"].get(name, [])
          assert any(str(line).endswith("/wl2866d.ko") for line in load if line.startswith("insmod ")), "WL2866D absent from modprobe dry-run"
          assert len(manifest["sha256"].get(name, "")) == 64, "WL2866D module digest missing"
          assert manifest["production_boot_load_order_qualified"] is False, "diagnostic test cannot select production order"
          print("[PASS] OEM Camera WL2866D staged, hashed and covered by depmod+modprobe")
          PY
          cat "$RUNNER_TEMP/mondrian-stage/mondrian-wlan-diagnostic-manifest.json" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Verify real Xiaomi Camera to OEM WL2866D ELF and module-load ABI
        run: |
          set -euo pipefail
          python3 tools/verify_mondrian_camera_wl2866d_abi.py \
            --camera xiaomi-camera-source/camera.ko \
            --wl2866d "$RUNNER_TEMP/mondrian-out/drivers/misc/wl2866d.ko" \
            --config "$RUNNER_TEMP/mondrian-out/.config" \
            --manifest "$RUNNER_TEMP/mondrian-stage/mondrian-wlan-diagnostic-manifest.json" \
            --out "$RUNNER_TEMP/camera-wl2866d-abi-evidence.json"
          echo "[PASS] Camera OEM WL2866D power ABI, module dependency and load order" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] Camera rail sequencing and device hardware test" >> "$GITHUB_STEP_SUMMARY"
      - name: Integrate exact OEM Kernel, Camera, Audio and native mondrian Devicetrees
        run: |
          set -euo pipefail
          test "$(git -C kernel rev-parse HEAD)" = c67ed74ffe11bd2133b560078a20cf0c04e18d97
          test "$(git -C device-tree rev-parse HEAD)" = a0db12120fc6c29cc5855d3e1699c9ef73594ee3
          test "$(git -C device-tree/upstream/xiaomi-dts rev-parse HEAD)" = 34e6cc7d832ed9c655b9d79bc3ffe1d625146b7c
          test "$(git -C device-tree/upstream/xiaomi-camera-platform rev-parse HEAD)" = a59a63bd498b94074c41357a466874b99aec62a8
          python3 -m venv "$RUNNER_TEMP/pe-bsp-dt-venv"
          "$RUNNER_TEMP/pe-bsp-dt-venv/bin/python" -m pip install --disable-pip-version-check lz4==4.4.5
          "$RUNNER_TEMP/pe-bsp-dt-venv/bin/python" -m unittest discover -s device-tree/tests -p 'test_mondrian_audio_fdt.py' -v
          "$RUNNER_TEMP/pe-bsp-dt-venv/bin/python" device-tree/tools/build_oem_dtbo.py \
            --kernel kernel \
            --expected-kernel-commit c67ed74ffe11bd2133b560078a20cf0c04e18d97 \
            --out "$RUNNER_TEMP/mondrian-coherent-board"
          "$RUNNER_TEMP/pe-bsp-dt-venv/bin/python" device-tree/tools/build_mondrian_camera_platform.py \
            --kernel kernel \
            --camera-kernel xiaomi-camera-source \
            --board-build "$RUNNER_TEMP/mondrian-coherent-board" \
            --out "$RUNNER_TEMP/mondrian-coherent-camera-platform"
          "$RUNNER_TEMP/pe-bsp-dt-venv/bin/python" device-tree/tools/build_mondrian_m11a.py \
            --kernel kernel --camera-build "$RUNNER_TEMP/mondrian-coherent-camera-platform" \
            --out "$RUNNER_TEMP/mondrian-coherent-m11a"
          python3 - "$RUNNER_TEMP/mondrian-coherent-board/dtbo-diagnostic-evidence.json" \
            "$RUNNER_TEMP/mondrian-coherent-camera-platform/mondrian-camera-platform-diagnostic-evidence.json" \
            "$RUNNER_TEMP/mondrian-stage/mondrian-wlan-diagnostic-manifest.json" \
            "$RUNNER_TEMP/mondrian-coherent-m11a/mondrian-m11a-build.json" \
            "$RUNNER_TEMP/mondrian-three-repo-diagnostic-evidence.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          board_path, camera_path, modules_path, display_path, output_path = map(pathlib.Path, sys.argv[1:])
          board, camera, modules = [json.loads(p.read_text()) for p in (board_path, camera_path, modules_path)]
          display = json.loads(display_path.read_text())
          kernel_sha = "c67ed74ffe11bd2133b560078a20cf0c04e18d97"
          bases = {"cape", "cape-v2", "capep"}
          assert board["kernel"] == kernel_sha and camera["kernel_commit"] == kernel_sha
          assert display["kernel_commit"] == kernel_sha and set(display["boards"]) == bases
          assert modules["kernel_commit"] == kernel_sha
          assert set(board["mondrian_oem_audio_compiled_evidence"]) == bases
          for variant in bases:
              amp = board["mondrian_oem_audio_compiled_evidence"][variant]
              assert amp["oem_board_speaker_gpio_and_i2c_verified"] is True
              assert amp["production_audio_approved"] is False
              assert sorted(amp["oem_aw882xx_amplifiers"]) == ["0x34", "0x35"]
              assert camera["per_board"][variant]["manufacturer_board_properties_preserved"] is True
          assert board["goodix_udfps_oem_bindings_verified"] is True
          assert board["camera_pmic_oem_source_links_compiled"] is True
          assert camera["all_three_cape_base_dtb_links_resolved"] is True
          assert camera["mondrian_m11a_csiphy2_and_4_bound"] is True
          assert camera["board_sensor_eeprom_routes_linked"] is True
          assert camera["board_rear_flash_switch0_mask"] == 1
          for variant in bases:
              mapped = camera["per_board"][variant]["controller_paths"]["qcom,csiphy"]
              assert len(mapped) == 6
          assert modules["camera_modules_included"] is True
          media_roots = set(modules["additional_external_roots"])
          assert {"machine_dlkm", "aw882xx_dlkm", "q6_dlkm", "gpr_dlkm", "msm_video"} <= media_roots
          assert media_roots <= set(modules["staged_module_order"])
          assert media_roots == set(modules["modprobe_additional_external_roots"])
          assert modules["production_boot_load_order_qualified"] is False
          for flag in ("production_camera_dtbo_approved", "physical_camera_hardware_tested"):
              assert camera[flag] is False
          for flag in ("mondrian_audio_kernel_abi_qualified", "mondrian_audio_hal_qualified",
                       "mondrian_audio_hardware_verified", "production_audio_approved"):
              assert board[flag] is False
          report = {
              "device": "mondrian", "android_base": "AOSP 17",
              "kernel_commit": kernel_sha,
              "modules_commit": "${{ github.sha }}",
              "devicetrees_commit": "a0db12120fc6c29cc5855d3e1699c9ef73594ee3",
              "coherent_kernel_modules_and_device_trees_compiled": True,
              "source_only_audio_speaker_and_mi2s_verified": True,
              "camera_cci_csiphy_controller_overlay_compiled": True,
              "camera_m11a_csiphy2_and_4_compiled": True,
              "camera_four_sensor_eeprom_routes_linked": camera["board_sensor_eeprom_routes_linked"],
              "camera_factory_sensor_by_slot": {
                  str(slot["camera_id"]): slot["sensor"]
                  for slot in camera["factory_camera_hal_profiles"]["slots"]
              },
              "camera_rear_flash_switch0_mask": camera["board_rear_flash_switch0_mask"],
              "camera_sensor_routing_verified": False,
              "m11a_camera_board_dtb_sha256": {name: info["sha256"] for name, info in display["boards"].items()},
              "m11a_lhbm_hardware_verified": False,
              "goodix_udfps_hardware_verified": False,
              "audio_video_kernel_compile_and_dependency_closure_verified": True,
              "audio_kernel_driver_verified": False,
              "video_hardware_verified": False,
              "audio_hal_and_hardware_verified": False,
              "production_boot_dtbo_and_modules_load_approved": False,
              "input_evidence_sha256": {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                                        for p in (board_path, camera_path, modules_path, display_path)},
          }
          output_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print("[PASS] Exact Kernel + Camera/Audio OEM DTB and external module diagnostic closure")
          print("[PENDING] M11A panel-on commands and LHBM on hardware, UDFPS runtime, Audio/Video HAL and physical runtime, sensors, product images")
          PY
          echo "[PASS] Three-repository OEM Image/Modules/Camera/Audio-DTB diagnostic build" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] Production boot/DTBO/modules.load and physical Camera/Audio/LHBM/UDFPS" >> "$GITHUB_STEP_SUMMARY"
      - name: Check reusable diagnostic Image, modules and matching SHA256 manifest
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/mondrian-out/arch/arm64/boot/Image"
          symvers="$RUNNER_TEMP/mondrian-out/Module.symvers"
          config="$RUNNER_TEMP/mondrian-out/.config"
          display="$GITHUB_WORKSPACE/kernel/techpack/display/msm/msm_drm.ko"
          wlan="$GITHUB_WORKSPACE/upstream/xiaomi-wlan/qcacld-3.0/qca_cld3_qca6490.ko"
          mmrm="$GITHUB_WORKSPACE/upstream/qualcomm/mmrm/driver/msm-mmrm.ko"
          camera="$GITHUB_WORKSPACE/xiaomi-camera-source/camera.ko"
          cameralog="$GITHUB_WORKSPACE/xiaomi-camera-source/cameralog.ko"
          manifest="$RUNNER_TEMP/mondrian-stage/mondrian-wlan-diagnostic-manifest.json"
          inventory="$RUNNER_TEMP/mondrian-inventory.json"
          for file in "$image" "$symvers" "$config" "$display" "$wlan" "$mmrm" "$camera" "$cameralog" "$manifest" "$inventory"; do
            test -s "$file" || { echo "::error::missing diagnostic artifact: $file"; exit 1; }
          done
          test "$(git -C kernel rev-parse HEAD)" = c67ed74ffe11bd2133b560078a20cf0c04e18d97
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["kernel_commit"]==sys.argv[2] and d["display_module_included"] and d["all_root_dry_run_union_matches_staged_closure"] and d["camera_modules_included"] and d["camera_modules_are_diagnostic_only"] and len(d["checked_module_roots"])==20+len(d["additional_external_roots"]) and len(d["audited_oem_roots"])==15 and {"machine_dlkm","aw882xx_dlkm","q6_dlkm","gpr_dlkm","msm_video"}<=set(d["additional_external_roots"]) and not d["production_boot_load_order_qualified"]' \
            "$manifest" c67ed74ffe11bd2133b560078a20cf0c04e18d97
          sha256sum "$image" "$symvers" "$config" "$display" "$wlan" "$mmrm" "$camera" "$cameralog" "$manifest" "$inventory" \
            > "$RUNNER_TEMP/mondrian-stage/diagnostic-sha256.txt"
          echo "[PASS] Pinned-source Image/Display/WLAN/MMRM/Camera/cameralog and exact dependency closure staged" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] M11A panel revision on hardware, production boot.img/dtbo.img and device boot" >> "$GITHUB_STEP_SUMMARY"
