name: Diagnostic Xiaomi SM8475 Camera build and OEM ABI (not production)

on:
  push:
    branches: [bringup/a17-mondrian-oem-bsp-20261111]
    paths:
      - .github/workflows/xiaomi-camera-compile-abi.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PixelExperience-Reborn/android_kernel_xiaomi_sm8450
          ref: 032260f7c8dacf338e1ac993e1653cd1982877d1
          path: kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MiCode/vendor_qcom_opensource_camera-kernel
          ref: 9ed4ce96d49c0759c6365627113c5f59c2407942
          path: xiaomi-camera-source
          persist-credentials: false
      - name: Reject unqualified source or kernel revision
        run: |
          set -euo pipefail
          test "$(git -C kernel rev-parse HEAD)" = 032260f7c8dacf338e1ac993e1653cd1982877d1
          test "$(git -C xiaomi-camera-source rev-parse HEAD)" = 9ed4ce96d49c0759c6365627113c5f59c2407942
          test "$(git -C upstream/qualcomm/mmrm rev-parse HEAD)" = "$(git ls-tree HEAD upstream/qualcomm/mmrm | awk '{print $3}')"
          test "$(git -C xiaomi-camera-source rev-parse 'HEAD^{tree}')" = e8fadfd2127cb9e12696273e1661ead9f9a70c89
          grep -Fx 'SUBLEVEL = 81' kernel/Makefile
          python3 - <<'PY'
          import json
          d = json.load(open("camera-bsp-candidate.json"))
          assert d["device"] == "mondrian" and d["soc"] == "SM8475"
          assert d["kernel"]["commit"] == "032260f7c8dacf338e1ac993e1653cd1982877d1"
          assert d["manufacturer_candidate"]["commit"] == "9ed4ce96d49c0759c6365627113c5f59c2407942"
          assert d["status"] == "SOURCE_ONLY_CANDIDATE_NOT_BUILT"
          assert not any(d["qualification"].values())
          PY
          test -f xiaomi-camera-source/Kbuild
          test -f xiaomi-camera-source/config/cape.mk
          test -f xiaomi-camera-source/config/waipio.mk
          test -f upstream/qualcomm/mmrm/driver/Kbuild
      - name: Install pinned OEM kernel build prerequisites
        timeout-minutes: 13
        run: bash tools/install_ci_prerequisites.sh
      - name: Restore known Google Android LLVM23 compiler
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/google-clang
          key: mondrian-a17-clang-r614150-c9ed23e2ba198658b630d4b10e09fa980cd43119
      - name: Restore exact LLVM23 toolchain when cache misses
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: bash kernel/tools/fetch_android_kernel_clang.sh /tmp/google-clang
      - uses: actions/cache/save@v4
        if: steps.clang-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/google-clang
          key: mondrian-a17-clang-r614150-c9ed23e2ba198658b630d4b10e09fa980cd43119
      - name: Reproduce exact mondrian OEM GKI configuration
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          test "$(git -C /tmp/google-clang rev-parse HEAD)" = c9ed23e2ba198658b630d4b10e09fa980cd43119
          mkdir -p "$RUNNER_TEMP/mondrian-out"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" gki_defconfig
          bash kernel/scripts/kconfig/merge_config.sh -m -r \
            -O "$RUNNER_TEMP/mondrian-out" \
            "$RUNNER_TEMP/mondrian-out/.config" \
            kernel/arch/arm64/configs/vendor/mondrian_GKI.config
          make -C kernel O="$RUNNER_TEMP/mondrian-out" olddefconfig
          grep -Fx 'CONFIG_ARCH_CAPE=y' "$RUNNER_TEMP/mondrian-out/.config"
          grep -Fx 'CONFIG_ARCH_WAIPIO=y' "$RUNNER_TEMP/mondrian-out/.config"
          python3 kernel/tools/verify_mondrian_oem_eroFS.py \
            --generated-config "$RUNNER_TEMP/mondrian-out/.config"
      - name: Compile real OEM vmlinux, Image and Module.symvers
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 vmlinux Image modules
          test -s "$RUNNER_TEMP/mondrian-out/vmlinux"
          test -s "$RUNNER_TEMP/mondrian-out/Module.symvers"
      - name: Build Qualcomm MMRM against same OEM kernel symbols
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          mmrm="$GITHUB_WORKSPACE/upstream/qualcomm/mmrm"
          test -f "$mmrm/config/waipiommrmconf.h"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$mmrm/driver" MMRM_ROOT="$mmrm" CONFIG_MSM_MMRM=y \
            KCFLAGS="-include $mmrm/config/waipiommrmconf.h" modules
          test -s "$mmrm/driver/msm-mmrm.ko"
          test -s "$mmrm/driver/Module.symvers"
          python3 tools/verify_external_module_abi.py \
            --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --module "$mmrm/driver/msm-mmrm.ko" \
            --expected-kernel-commit 032260f7c8dacf338e1ac993e1653cd1982877d1 \
            --out camera-mmrm-abi-evidence.json
      - name: Compile original Xiaomi camera.ko and cameralog.ko with MMRM symbols
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          cam="$GITHUB_WORKSPACE/xiaomi-camera-source"
          mmrm_syms="$GITHUB_WORKSPACE/upstream/qualcomm/mmrm/driver/Module.symvers"
          test -s "$mmrm_syms"
          make -C kernel O="$RUNNER_TEMP/mondrian-out" -j3 \
            M="$cam" CAMERA_KERNEL_ROOT="$cam" KERNEL_ROOT="$GITHUB_WORKSPACE/kernel" \
            KBUILD_EXTRA_SYMBOLS="$mmrm_syms" modules \
            2>&1 | tee camera-compile-diagnostic.log
          test -s "$cam/camera.ko"
          test -s "$cam/cameralog.ko"
      - name: Verify both Xiaomi modules against the exact compiled OEM ABI
        run: |
          set -euo pipefail
          for module in camera cameralog; do
            modinfo -F name "xiaomi-camera-source/$module.ko"
            modinfo -F depends "xiaomi-camera-source/$module.ko"
            python3 tools/verify_external_module_abi.py \
              --kernel kernel --kernel-out "$RUNNER_TEMP/mondrian-out" \
              --module "xiaomi-camera-source/$module.ko" \
              --expected-kernel-commit 032260f7c8dacf338e1ac993e1653cd1982877d1 \
              --out "camera-$module-abi-evidence.json"
          done
          echo "[PASS] Xiaomi Camera modules compile and pass static OEM ABI checks" >> "$GITHUB_STEP_SUMMARY"
          echo "[PENDING] mondrian camera sensors, firmware, dtbo, HAL and hardware test" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve compiler errors and ABI evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-camera-oem-abi-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            camera-compile-diagnostic.log
            camera-*-abi-evidence.json
            xiaomi-camera-source/*.ko
            xiaomi-camera-source/*.mod
