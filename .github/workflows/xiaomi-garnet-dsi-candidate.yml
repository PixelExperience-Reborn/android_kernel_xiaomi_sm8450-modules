name: Qualify full Xiaomi Display against archived OEM symbols (diagnostic only)

on:
  push:
    branches:
      - bringup/a17-mondrian-oem-bsp-20261111
    paths:
      - .github/workflows/xiaomi-garnet-dsi-candidate.yml
      - tools/qualify_xiaomi_garnet_display.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mondrian-xiaomi-garnet-dsi-candidate
  cancel-in-progress: false

jobs:
  dsi-object:
    # No ServerHive reservation or vmlinux relink; candidate retains Full LTO.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PixelExperience-Reborn/android_kernel_xiaomi_sm8450
          ref: 2efda4cf1afa2a7098d5abd4806769903e181f73
          path: kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MiCode/vendor_opensource_display-drivers
          ref: bf0d5e23be5457001a18aa9dcd68cb17994ae36a
          path: xiaomi-display
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MiCode/vendor_qcom_proprietary_display-devicetree
          ref: ab5bc7b921d3d4072ce11eecfde984382e3ec695
          path: xiaomi-display-dt
          persist-credentials: false
      - name: Check Python and exact pristine source
        run: |
          set -euo pipefail
          python3 -m py_compile tools/qualify_xiaomi_garnet_display.py
          python3 tools/qualify_xiaomi_garnet_display.py \
            --kernel kernel --xiaomi-display xiaomi-display \
            --out "$RUNNER_TEMP/garnet-source"
      - name: Install signed build prerequisites including target C sysroot
        timeout-minutes: 13
        env:
          PE_REQUIRE_ARM64_LINK_SYSROOT: '1'
        run: |
          set -euo pipefail
          bash tools/install_ci_prerequisites.sh
          command -v aarch64-linux-gnu-gcc
          test -s /usr/aarch64-linux-gnu/include/stdio.h
          test -s /usr/aarch64-linux-gnu/lib/libc.a
          test -s /usr/aarch64-linux-gnu/lib/crt1.o
      - uses: actions/cache/restore@v4
        id: clang-cache
        with:
          path: /tmp/google-clang
          key: mondrian-a17-clang-r614150-c9ed23e2ba198658b630d4b10e09fa980cd43119
      - name: Fetch Google LLVM 23
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: bash kernel/tools/fetch_android_kernel_clang.sh /tmp/google-clang
      - uses: actions/cache/save@v4
        if: steps.clang-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/google-clang
          key: mondrian-a17-clang-r614150-c9ed23e2ba198658b630d4b10e09fa980cd43119
      - name: Download archived OEM kernel and MMRM symbol evidence from run 131
        uses: actions/download-artifact@v4
        with:
          name: mondrian-coherent-oem-wlan-kmi-diagnostics
          run-id: 45445498683
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline131
      - name: Prepare exact OEM configuration without linking vmlinux
        run: |
          set -euo pipefail
          export PATH=/tmp/google-clang/clang-r614150/bin:$PATH
          export ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-
          test "$(git -C /tmp/google-clang rev-parse HEAD)" = c9ed23e2ba198658b630d4b10e09fa980cd43119
          ko="$RUNNER_TEMP/mondrian-out"
          mkdir -p "$ko"
          baseline="$RUNNER_TEMP/baseline131"
          # OEM Makefile wraps CC with scripts/basic/cc-wrapper before probing
          # CLANG_FLAGS. On a clean O= tree the first config invocation builds
          # that wrapper but can probe with empty target flags. Bootstrap it
          # using the proven GKI target BEFORE installing the archived config.
          # Never accept the bootstrap config as the replay configuration.
          make -C kernel O="$ko" gki_defconfig
          test -x "$ko/scripts/basic/cc-wrapper"
          "$ko/scripts/basic/cc-wrapper" clang --version
          printf '%s\n' '.arch armv8.5-a+memtag' 'stgm xzr,[x0]' | \
            "$ko/scripts/basic/cc-wrapper" clang --target=aarch64-linux-gnu \
              -Werror -c -x assembler -o /dev/null -
          "$ko/scripts/basic/cc-wrapper" clang --target=aarch64-linux-gnu \
            -Werror -fsanitize=shadow-call-stack -ffixed-x18 -c -x c /dev/null -o /dev/null
          # Match Makefile's target/prefix/GCC discovery flags; check both
          # userspace link modes before Kconfig, without changing any symbol.
          prefix="$(dirname "$(command -v aarch64-linux-gnu-elfedit)")"
          gcc_root="$(realpath "$prefix/..")"
          link_flags=(--target=aarch64-linux-gnu "--prefix=$prefix/aarch64-linux-gnu" "--gcc-toolchain=$gcc_root" -Werror=unknown-warning-option)
          for mode in dynamic static; do
            extra=()
            if [[ "$mode" == static ]]; then extra=(-static); fi
            printf '%s\n' '#include <stdio.h>' 'int main(void) { printf(""); return 0; }' | \
              "$ko/scripts/basic/cc-wrapper" clang "${link_flags[@]}" "${extra[@]}" -x c - -o "$RUNNER_TEMP/probe-$mode"
            readelf -h "$RUNNER_TEMP/probe-$mode" | grep -F AArch64
            bash kernel/scripts/cc-can-link.sh "$ko/scripts/basic/cc-wrapper" clang "${link_flags[@]}" "${extra[@]}"
          done
          cp "$baseline/_temp/mondrian-out/.config" "$ko/.config"
          cp "$baseline/_temp/mondrian-out/Module.symvers" "$ko/Module.symvers"
          echo "515a9b992035c43e7c78d548287fb00d263dbad3c88e5392ab1bc043105870a3  $ko/.config" | sha256sum -c -
          echo "2191efa191b246a22c9e8631fd471447e53092d340b47b49698eed7cc65c4c29  $ko/Module.symvers" | sha256sum -c -
          make -C kernel O="$ko" olddefconfig
          # Exact byte identity is required, not just a subset of hardening options.
          if ! cmp -s "$baseline/_temp/mondrian-out/.config" "$ko/.config"; then
            diff -u "$baseline/_temp/mondrian-out/.config" "$ko/.config" || true
            exit 1
          fi
          grep -Fx "CONFIG_CC_CAN_LINK=y" "$ko/.config"
          grep -Fx "CONFIG_CC_CAN_LINK_STATIC=y" "$ko/.config"
          python3 tools/verify_mondrian_kernel_hardening.py \
            --generated-config "$ko/.config" --out "$RUNNER_TEMP/garnet-hardening.json"
          make -C kernel O="$ko" -j3 modules_prepare
          echo "515a9b992035c43e7c78d548287fb00d263dbad3c88e5392ab1bc043105870a3  $ko/.config" | sha256sum -c -
          echo "2191efa191b246a22c9e8631fd471447e53092d340b47b49698eed7cc65c4c29  $ko/Module.symvers" | sha256sum -c -
          grep -Fx 'CONFIG_MODVERSIONS=y' "$ko/.config"
          make -s -C kernel O="$ko" kernelrelease
          python3 - "$baseline/_temp/display-abi-evidence.json" "$ko/include/config/kernel.release" <<'PY'
          import json, pathlib, sys
          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text())
          release = pathlib.Path(sys.argv[2]).read_text().strip()
          assert release == evidence["kernelrelease"], (release, evidence["kernelrelease"])
          PY
      - name: Compile and MODPOST entire Xiaomi Display candidate against archived OEM symbols
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/baseline131"
          mmrm=$(find "$baseline" -path '*/upstream/qualcomm/mmrm/driver/Module.symvers' -type f)
          test -f "$mmrm"
          python3 tools/qualify_xiaomi_garnet_display.py \
            --kernel kernel --xiaomi-display xiaomi-display \
            --xiaomi-display-dt xiaomi-display-dt --clang-root /tmp/google-clang \
            --kernel-out "$RUNNER_TEMP/mondrian-out" \
            --baseline-evidence "$baseline/_temp/display-abi-evidence.json" \
            --mmrm-symvers "$mmrm" --build --replay-symbols \
            --out "$RUNNER_TEMP/garnet-object"
          echo 'Full Xiaomi module and imported CRCs checked using archived #131 symbols; no new vmlinux or hardware qualification.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mondrian-xiaomi-garnet-full-symbol-replay
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/garnet-source/source-evidence.json
            ${{ runner.temp }}/garnet-object/
            ${{ runner.temp }}/garnet-hardening.json
            ${{ runner.temp }}/mondrian-out/.config
            ${{ runner.temp }}/mondrian-out/include/config/kernel.release
